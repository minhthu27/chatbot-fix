// ============ XSS PROTECTION ============
function safeHtml(dirty){
  if(typeof DOMPurify === 'undefined'){
    console.warn('[SECURITY] DOMPurify chưa load - fallback về escHtml');
    return escHtml(dirty);
  }
  return DOMPurify.sanitize(dirty, {
    ALLOWED_TAGS: ['p','br','strong','em','u','s','code','pre','ul','ol','li',
                   'h1','h2','h3','h4','h5','h6','blockquote','a','hr',
                   'table','thead','tbody','tr','th','td','span','div','img'],
    ALLOWED_ATTR: ['href','title','alt','src','class','colspan','rowspan'],
    ALLOW_DATA_ATTR: false,   // chặn data-* để tránh clickjacking nội bộ
    FORBID_TAGS: ['script','style','iframe','object','embed','form','input','button'],
    FORBID_ATTR: ['onerror','onload','onclick','onmouseover','onfocus',
                  'onblur','onchange','onsubmit','oninput','formaction','style'],
  });
}

// Chặn link javascript: trong markdown
if(typeof DOMPurify !== 'undefined'){
  DOMPurify.addHook('afterSanitizeAttributes', function(node){
    if(node.tagName === 'A' && node.hasAttribute('href')){
      const href = node.getAttribute('href').trim().toLowerCase();
      if(href.startsWith('javascript:') || href.startsWith('data:')){
        node.removeAttribute('href');
      }
    }
  });
}
</script>

(function installAuthWarning(){
  const origFetch = window.fetch;
  window.fetch = function(...args){
    return origFetch.apply(this, args).then(res => {
      if(res.status === 401) showAuthWarning();
      return res;
    });
  };
})();
let _authWarningShown = false;
function showAuthWarning(){
  if(_authWarningShown) return;
  _authWarningShown = true;
  const bar = document.createElement('div');
  bar.id = 'auth-warning-bar';
  bar.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#7c2d12;color:#fff;'
    + 'padding:10px 16px;text-align:center;font-size:13.5px;z-index:9999;cursor:pointer;'
    + 'display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap';
  bar.innerHTML = '<span>Sai hoặc thiếu API Key — bấm để mở Thiết lập và nhập đúng API Key khớp với '
    + '<code style="background:rgba(255,255,255,.15);padding:1px 5px;border-radius:4px">API_AUTH_TOKEN</code> trên server.</span>'
    + '<button id="auth-warning-close" style="background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:5px;padding:3px 10px;cursor:pointer">Đóng</button>';
  bar.querySelector('span').onclick = () => { openSettings(); };
  bar.querySelector('#auth-warning-close').onclick = (e) => { e.stopPropagation(); bar.remove(); _authWarningShown = false; };
  document.body.prepend(bar);
}

// ============ CẤU HÌNH / DANH TÍNH ============
function getCfg(){
  return {
    chatUrl:  (localStorage.getItem('chatUrl')  || 'http://127.0.0.1:8018').replace(/\/$/,''),
    adminUrl: (localStorage.getItem('adminUrl') || 'http://127.0.0.1:8019').replace(/\/$/,''),
    apiKey:   localStorage.getItem('apiKey') || '',
    userName: localStorage.getItem('userName') || '',
    userEmail: localStorage.getItem('userEmail') || '',
  };
}
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function refreshUserBadge(){
  const c = getCfg();
  const name = c.userName || 'Khách';
  document.getElementById('sb-user-name').textContent = name;
  document.getElementById('sb-user-email').textContent = c.userEmail || 'Chưa đăng nhập';
  document.getElementById('sb-avatar').textContent = name.trim().charAt(0).toUpperCase() || 'K';
  document.getElementById('topbar-who').textContent = c.userEmail || name;
}

function toggleUserMenu(){ document.getElementById('sb-user-menu').classList.toggle('open'); }
document.addEventListener('click', (e) => {
  if(!e.target.closest('.sb-user')) document.getElementById('sb-user-menu').classList.remove('open');
});

// ============ MOBILE SIDEBAR ============
function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  const open = sb.classList.toggle('open');
  bd.classList.toggle('show', open);
}
function closeSidebarOnMobile(){
  if(window.innerWidth <= 768){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-backdrop').classList.remove('show');
  }
}

// ============ SETTINGS ============
function openSettings(){
  const c = getCfg();
  document.getElementById('set-name').value = c.userName;
  document.getElementById('set-email').value = c.userEmail;
  document.getElementById('set-chat-url').value = c.chatUrl;
  document.getElementById('set-admin-url').value = c.adminUrl;
  document.getElementById('set-api-key').value = c.apiKey;
  document.getElementById('settings-modal').style.display = 'flex';
  document.getElementById('sb-user-menu').classList.remove('open');
}
function closeSettings(){ document.getElementById('settings-modal').style.display = 'none'; }
function saveSettings(){
  localStorage.setItem('userName', document.getElementById('set-name').value.trim());
  localStorage.setItem('userEmail', document.getElementById('set-email').value.trim());
  localStorage.setItem('chatUrl', document.getElementById('set-chat-url').value.trim());
  localStorage.setItem('adminUrl', document.getElementById('set-admin-url').value.trim());
  localStorage.setItem('apiKey', document.getElementById('set-api-key').value);
  refreshUserBadge();
  closeSettings();
}
function goAdmin(){ window.location.href = 'admin.html'; }
function logout(){
  if(!confirm('Đăng xuất? Tên/email tự khai sẽ bị xoá khỏi thiết bị này (lịch sử chat vẫn giữ).')) return;
  localStorage.removeItem('userName'); localStorage.removeItem('userEmail');
  refreshUserBadge();
  document.getElementById('sb-user-menu').classList.remove('open');
}

// Đóng modal khi click backdrop
document.getElementById('settings-modal').addEventListener('click', (e) => {
  if(e.target.id === 'settings-modal') closeSettings();
});
document.getElementById('dislike-modal').addEventListener('click', (e) => {
  if(e.target.id === 'dislike-modal') closeDislikeModal();
});

// ============ LƯU TRỮ CUỘC TRÒ CHUYỆN ============
const CONV_KEY = 'neuai_conversations';
function loadConversations(){
  try{ return JSON.parse(localStorage.getItem(CONV_KEY) || '[]'); }catch(e){ return []; }
}
function saveConversations(list){ localStorage.setItem(CONV_KEY, JSON.stringify(list)); }

let currentConvId = null;
let currentSessionId = '';

function renderConvList(){
  const filter = (document.getElementById('sb-search').value || '').toLowerCase();
  const list = loadConversations().filter(c => c.title.toLowerCase().includes(filter));
  list.sort((a,b) => b.updated_at - a.updated_at);
  const box = document.getElementById('sb-conv-list');
  box.innerHTML = list.map(c => `
    <div class="sb-conv ${c.id === currentConvId ? 'active' : ''}" data-id="${escHtml(c.id)}">
      <span style="overflow:hidden;text-overflow:ellipsis">${escHtml(c.title)}</span>
      <span class="sb-conv-del" data-del="${escHtml(c.id)}">${ICONS.trash}</span>
    </div>`).join('');
  box.querySelectorAll('.sb-conv').forEach(el => {
    el.addEventListener('click', (e) => {
      if(e.target.closest('[data-del]')) return;
      openConversation(el.dataset.id);
    });
  });
  box.querySelectorAll('[data-del]').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); deleteConversation(el.dataset.del); });
  });
}

function newConversation(){
  currentConvId = null;
  currentSessionId = '';
  document.getElementById('conv-title').textContent = 'Cuộc trò chuyện mới';
  document.getElementById('messages').innerHTML = '';
  document.getElementById('messages').style.display = 'none';
  document.getElementById('greeting').style.display = 'block';
  renderConvList();
  closeSidebarOnMobile();
  document.getElementById('chat-input').focus();
}

function openConversation(id){
  const conv = loadConversations().find(c => c.id === id);
  if(!conv) return;
  currentConvId = id;
  currentSessionId = conv.session_id || '';
  document.getElementById('conv-title').textContent = conv.title;
  const box = document.getElementById('messages');
  box.innerHTML = '';
  conv.messages.forEach(m => renderMessage(m.role, m.html, m.meta, m.msgId, m.disliked));
  document.getElementById('greeting').style.display = 'none';
  box.style.display = 'flex';
  document.getElementById('chat-wrap').scrollTop = 0;
  renderConvList();
  closeSidebarOnMobile();
}

function deleteConversation(id){
  if(!confirm('Xoá cuộc trò chuyện này?')) return;
  const list = loadConversations().filter(c => c.id !== id);
  saveConversations(list);
  if(currentConvId === id) newConversation();
  else renderConvList();
}

function persistMessage(role, html, meta, msgId, question, answer, citations, answer_warnings){
  let list = loadConversations();
  let conv = list.find(c => c.id === currentConvId);
  if(!conv){
    currentConvId = 'c_' + Date.now();
    conv = {id: currentConvId, title: (question || html || 'Cuộc trò chuyện').slice(0, 60),
            session_id: currentSessionId, messages: [], updated_at: Date.now()};
    list.unshift(conv);
  }
  conv.session_id = currentSessionId;
  conv.updated_at = Date.now();
  conv.messages.push({role, html, meta, msgId, question, answer,
                      citations: citations || null,
                      answer_warnings: answer_warnings || null,   // ← MỚI
                      disliked: false});
  saveConversations(list);
  document.getElementById('conv-title').textContent = conv.title;
  renderConvList();
}

function markDislikedInStorage(msgId){
  let list = loadConversations();
  const conv = list.find(c => c.id === currentConvId);
  if(!conv) return;
  const m = conv.messages.find(x => x.msgId === msgId);
  if(m){ m.disliked = true; saveConversations(list); }
}

// ============ HIỂN THỊ TIN NHẮN ============
function renderMessage(role, html, meta, msgId, disliked){
  document.getElementById('greeting').style.display = 'none';
  const box = document.getElementById('messages');
  box.style.display = 'flex';
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  let metaHtml = '';
  if(meta && meta.response_time_ms){
    metaHtml = `<div class="msg-meta">${Math.round(meta.response_time_ms)}ms · ${escHtml(meta.model||'')}</div>`;
  }
  let actionsHtml = '';
  if(role === 'bot' && msgId){
    actionsHtml = `<div class="msg-actions">
      <button data-like="${escHtml(msgId)}" ${disliked ? 'disabled' : ''}>${ICONS.thumbsUp}</button>
      <button data-dislike="${escHtml(msgId)}" class="${disliked ? 'disliked' : ''}" ${disliked ? 'disabled' : ''}>${disliked ? ICONS.thumbsDown + ' Đã gửi' : ICONS.thumbsDown}</button>
    </div>`;
  }
  // metaHtml và actionsHtml đã được escHtml khi build nên an toàn.
  // html có thể chứa nội dung từ localStorage (đã lưu từ lần trước) -
  // phải sanitize lại để chống stored XSS.
  const safeBubble = safeHtml(html);
  wrap.innerHTML = `<div class="bubble">${safeBubble}</div>${metaHtml}${actionsHtml}`;

  box.appendChild(wrap);
  document.getElementById('chat-wrap').scrollTop = document.getElementById('chat-wrap').scrollHeight;
  const dislikeBtn = wrap.querySelector('[data-dislike]');
  if(dislikeBtn && !dislikeBtn.disabled) {
    dislikeBtn.addEventListener('click', () => openDislikeModal(msgId));
  }
  const likeBtn = wrap.querySelector('[data-like]');
  if(likeBtn) likeBtn.addEventListener('click', () => { likeBtn.style.color = '#5fd88a'; likeBtn.disabled = true; });
  return wrap;
}

// ============ DISLIKE ============
let pendingDislikeMsgId = null;
function openDislikeModal(msgId){
  pendingDislikeMsgId = msgId;
  document.getElementById('dislike-reason').value = '';
  document.getElementById('dislike-modal').style.display = 'flex';
}
function closeDislikeModal(){ document.getElementById('dislike-modal').style.display = 'none'; pendingDislikeMsgId = null; }

async function submitDislike(){
  const msgId = pendingDislikeMsgId;
  if(!msgId) return;
  const conv = loadConversations().find(c => c.id === currentConvId);
  const m = conv ? conv.messages.find(x => x.msgId === msgId) : null;
  if(!m){ closeDislikeModal(); return; }

  const reason = document.getElementById('dislike-reason').value.trim();
  const c = getCfg();
  try{
    await fetch(c.chatUrl + '/feedback', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-API-Key': c.apiKey},
      body: JSON.stringify({
        question: m.question || '', answer: m.answer || '', reason,
        citations: m.citations || [],
        answer_warnings: m.answer_warnings || [],   // ← MỚI
        user_name: c.userName || 'Khách', user_email: c.userEmail || ''
      })
    });
  }catch(e){ /* không chặn UI */ }

  markDislikedInStorage(msgId);
  const btn = document.querySelector(`[data-dislike="${CSS.escape(msgId)}"]`);
  if(btn){
    btn.classList.add('disliked');
    btn.innerHTML = ICONS.thumbsDown + ' Đã gửi';
    btn.disabled = true;
    // Clone để xoá sạch listener cũ - tránh click lại
    const fresh = btn.cloneNode(true);
    btn.replaceWith(fresh);
  }
  closeDislikeModal();
}

// ============ GỬI CÂU HỎI ============
async function handleSend(e){
  e.preventDefault();
  const inp = document.getElementById('chat-input');
  const q = inp.value.trim();
  if(!q) return;
  inp.value = '';
  inp.style.height = 'auto';
  renderMessage('user', escHtml(q).replace(/\n/g, '<br>'));
  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  const thinkingWrap = renderMessage('bot', '<span class="spinner"></span>Đang xử lý...');
  const c = getCfg();
  try{
    const r = await fetch(c.chatUrl + '/ask', {
      method: 'POST', headers: {'Content-Type': 'application/json', 'X-API-Key': c.apiKey},
      body: JSON.stringify({prompt: q, session_id: currentSessionId || undefined,
                            user_name: c.userName || 'Khách', user_email: c.userEmail || ''})
    });
    const data = await r.json();
    if(!r.ok){
      thinkingWrap.querySelector('.bubble').innerHTML = 'Lỗi: ' + escHtml(data.error || r.status);
      persistMessage('user', escHtml(q), null, null, q, null);
      return;
    }
    currentSessionId = data.session_id || currentSessionId;
const md = data.content_markdown || '(không có nội dung)';
const rawHtml = window.marked ? marked.parse(md) : escHtml(md).replace(/\n/g, '<br>');
const html = safeHtml(rawHtml);   // ← sanitize ngay sau khi parse
    let citeHtml = '';
    if(data.citations && data.citations.length){
      citeHtml = '<div class="citations">Nguồn: ' + data.citations.map(ct =>
        escHtml([ct.loai_van_ban, ct.so_hieu, ct.source_file].filter(Boolean).join(' - '))).join(' · ') + '</div>';
    }
    const msgId = 'm_' + Date.now();
    thinkingWrap.remove();
    persistMessage('user', escHtml(q), null, null, q, null);
    persistMessage('bot', html + citeHtml, data.meta, msgId, q, md,
                   data.citations || [], data.answer_warnings || []);
    renderMessage('bot', html + citeHtml, data.meta, msgId, false);
  }catch(err){
    thinkingWrap.querySelector('.bubble').innerHTML = 'Lỗi: ' + escHtml(err.message);
  }finally{
    sendBtn.disabled = false;
  }
}

document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); handleSend(e); }
});
document.getElementById('chat-input').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(160, e.target.scrollHeight) + 'px';
});
document.getElementById('sb-search').addEventListener('input', renderConvList);

// Đóng sidebar mobile khi resize lên desktop
window.addEventListener('resize', () => {
  if(window.innerWidth > 768){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-backdrop').classList.remove('show');
  }
});

// ============ THEME TOGGLE ============
function applyThemeIcon(){
  const t = document.documentElement.getAttribute('data-theme') || 'dark';
  const sun = document.getElementById('theme-icon-light');
  const moon = document.getElementById('theme-icon-dark');
  if(!sun || !moon) return;
  sun.style.display  = (t === 'light') ? 'block' : 'none';
  moon.style.display = (t === 'dark')  ? 'block' : 'none';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  applyThemeIcon();
}
applyThemeIcon();

// ============ INIT ============
refreshUserBadge();
renderConvList();
const params = new URLSearchParams(window.location.search);
const verifyQ = params.get('verify');
if(verifyQ){
  document.getElementById('chat-input').value = verifyQ;
  setTimeout(() => handleSend(new Event('submit')), 200);
}
</script>
